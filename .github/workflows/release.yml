name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза, например 1.0.1. Пусто — только тестовая сборка.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "TAG=v${INPUT_VERSION#v}" >> "$GITHUB_ENV"
          else
            echo "TAG=" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm run fonts

      - name: Create Android project
        run: |
          npx cap add android
          cp -r android-res/* android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -exec cp assets/splash.png {} \;
          python3 scripts/patch-android.py "${TAG:-dev}" "${GITHUB_RUN_NUMBER}"
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "STORE_PASS=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing secrets are not set, using a one-time key. Updates will need a reinstall."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias checklist \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass temporary -keypass temporary \
              -dname "CN=Check List"
            echo "STORE_PASS=temporary" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias=checklist \
            -Pandroid.injected.signing.key.password="$STORE_PASS"

      - name: Collect APK
        run: |
          VERSION="${TAG#v}"
          [ -n "$TAG" ] || VERSION="dev-${GITHUB_RUN_NUMBER}"
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          mkdir -p dist
          cp "$APK" "dist/Pokupki-${VERSION}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Покупки ${TAG}" \
            --notes-file RELEASE_NOTES.md
